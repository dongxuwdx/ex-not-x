<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7f93c4"><meta name="description" content="转动玻璃卡片，看见今日问题。"><title>Ex not X｜今日问题</title>
<script>document.documentElement.classList.add('js');</script>
<style>
:root{color-scheme:light;--ink:#1b2128;--muted:#3f4a57;--focus:#1c6082;--font:-apple-system,BlinkMacSystemFont,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:var(--font);color:var(--ink);background:#9fb0da;-webkit-font-smoothing:antialiased}
button,a{font:inherit}button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:5px}
#rip{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.city-blur{position:fixed;inset:-40px;background:url('assets/ref-city.jpg') center 40%/cover;filter:blur(28px) saturate(1.15) brightness(1.04)}
.city-img{position:fixed;display:block;user-select:none;pointer-events:none}
.city-framed .city-img{-webkit-mask:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.hand{position:fixed;z-index:1;width:clamp(240px,28vw,440px);pointer-events:none;user-select:none;filter:drop-shadow(-18px 24px 30px rgba(40,24,70,.35));transform-origin:4.5% 14.4%;animation:reach 5.5s ease-in-out infinite;opacity:0;transition:opacity .6s}
.hand.ready{opacity:1}
@keyframes reach{0%,100%{translate:0 0;rotate:0deg}50%{translate:-6px -8px;rotate:-1.2deg}}
.site-header{position:fixed;top:0;left:0;z-index:5;padding:20px clamp(20px,4vw,56px)}
.site-brand{display:inline-flex;align-items:center;min-height:44px;color:#fff;font-size:24px;font-weight:700;letter-spacing:-.04em;text-decoration:none;text-shadow:0 1px 14px rgba(38,30,90,.45)}
main{position:fixed;inset:0;z-index:2;display:flex;justify-content:center;align-items:center;touch-action:none;cursor:grab}
main.dragging{cursor:grabbing}
.stage{position:relative;width:min(560px,90vw);perspective:1200px;container-type:inline-size;translate:-3vw -2vh}
.membrane{position:relative;border-radius:34px;padding:clamp(24px,6.2cqi,38px) clamp(22px,6cqi,36px) clamp(26px,6.6cqi,40px);min-height:300px;display:flex;flex-direction:column;justify-content:center;transform-style:preserve-3d;backface-visibility:visible;transform:rotateY(180deg);will-change:transform;
 background:linear-gradient(140deg,rgba(255,255,255,.55),rgba(255,255,255,.22) 48%,rgba(255,255,255,.34));
 -webkit-backdrop-filter:blur(16px) saturate(170%) brightness(1.06);backdrop-filter:blur(16px) saturate(170%) brightness(1.06);
 border:1px solid rgba(255,255,255,.75);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.12),inset 18px 0 40px -30px rgba(255,255,255,.9),0 40px 80px -36px rgba(36,22,80,.55)}
.membrane::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 28%,rgba(255,255,255,.42) 40%,transparent 52%),radial-gradient(120% 70% at 0% 0%,rgba(255,255,255,.35),transparent 55%);mix-blend-mode:soft-light}
.membrane::after{content:'';position:absolute;inset:6px;border-radius:29px;pointer-events:none;border:1px solid rgba(255,255,255,.28)}
.membrane.settling{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.question-label{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 22px;align-self:flex-start}
.question{font-size:clamp(17px,5.3cqi,30px);line-height:1.3;letter-spacing:-.02em;font-weight:650;margin:0;text-align:center;white-space:nowrap}
.question-note{color:var(--muted);line-height:1.6;font-size:15px;margin:16px 0 0;text-align:center}
.stances{display:flex;gap:12px;margin-top:30px;justify-content:center;flex-wrap:wrap}
.stance{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;min-height:48px;min-width:96px;border-radius:18px;font-size:15px;font-weight:650;text-decoration:none;cursor:pointer;
 -webkit-backdrop-filter:blur(10px) saturate(180%);backdrop-filter:blur(10px) saturate(180%);border:1px solid rgba(255,255,255,.7);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -8px 16px -10px rgba(255,255,255,.6),0 10px 24px -14px rgba(30,20,60,.5);transition:transform .2s,filter .2s}
.stance::before{content:'';position:absolute;inset:1px 1px 50% 1px;border-radius:17px 17px 40% 40%/17px 17px 12px 12px;background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.stance span{font-size:19px;line-height:1}
.stance.green{background:linear-gradient(160deg,rgba(168,226,190,.62),rgba(92,170,128,.32));color:#21503f}
.stance.blue{background:linear-gradient(160deg,rgba(170,204,240,.62),rgba(92,138,196,.32));color:#2a4a6c;font-style:italic;letter-spacing:.02em}
.stance.red{background:linear-gradient(160deg,rgba(246,180,182,.64),rgba(206,98,106,.32));color:#7b3439}
.stance:hover{transform:translateY(-3px);filter:brightness(1.05)}.stance:active{transform:scale(.97)}
.js .is-back .stance{pointer-events:none;cursor:default}
.flip-guide{position:absolute;inset:-14% -20% -30% -20%;pointer-events:none;overflow:visible;opacity:0;transition:opacity .5s}
.flip-guide.show{opacity:1}
.flip-guide svg{width:100%;height:100%;overflow:visible}
.flip-guide .arc{fill:none;stroke:rgba(255,255,255,.62);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 2px 8px rgba(40,20,90,.35))}
.flip-guide .arc.ghost{stroke:rgba(255,255,255,.3);stroke-dasharray:2 14}
.flip-guide .head{fill:rgba(255,255,255,.8);filter:drop-shadow(0 2px 8px rgba(40,20,90,.35))}
.flip-guide .flow{stroke:rgba(255,255,255,.95);stroke-width:10;stroke-dasharray:70 1100;animation:flow 2.6s cubic-bezier(.45,.05,.3,1) infinite}
@keyframes flow{from{stroke-dashoffset:1170}to{stroke-dashoffset:0}}
.is-opening .stage{opacity:0;transform:scale(.94) rotateX(-12deg);transition:transform .55s ease,opacity .55s ease}
.is-opening .city-img,.is-opening .city-blur,.is-opening #rip,.is-opening .hand{filter:blur(6px) brightness(1.1);transition:filter .6s}
@media(max-width:700px){.flip-guide{inset:-8% -3% -24% -3%}.site-brand{font-size:21px}.stage{width:min(92vw,420px);translate:0 -4vh}.membrane{min-height:250px;border-radius:28px}.stance{min-width:80px;padding:11px 14px;font-size:14px}.hand{width:min(62vw,300px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
@media(prefers-reduced-transparency:reduce),(prefers-contrast:more){.membrane{background:#f6f8fbf0;-webkit-backdrop-filter:none;backdrop-filter:none}}
</style>
</head>
<body>
<div class="city-blur" aria-hidden="true"></div><img id="city-img" class="city-img" src="assets/ref-city.jpg" alt="" draggable="false"><canvas id="rip" aria-hidden="true"></canvas>
<img class="hand" id="hand" src="assets/hand-pointer-natural-v2.png" alt="" draggable="false">
<header class="site-header"><a class="site-brand" href="index.html" aria-label="Ex not X，回到首页">Ex not X</a></header>
<main id="orbit"><div class="stage" id="stage">
 <section id="membrane" class="membrane is-back" aria-label="今日问题，背面。拖动画面翻转卡片">
  <p class="question-label">今天想和你聊聊</p>
  <h1 id="question-heading" class="question">恋爱中，需要分享所有社交密码吗？</h1>
  <p class="question-note">亲密的距离，由你定义</p>
  <div id="stances" class="stances" aria-label="选择你对今日问题的看法">
   <a class="stance green" href="experience.html?stance=green#river"><span aria-hidden="true">✓</span>赞同</a>
   <a class="stance blue" href="experience.html?stance=blue#river" aria-label="or，保留判断"><span aria-hidden="true">○</span>or</a>
   <a class="stance red" href="experience.html?stance=red#river"><span aria-hidden="true">×</span>反对</a>
  </div>
 </section>
 <div class="flip-guide" id="flip-guide" aria-hidden="true"><svg viewBox="0 0 1000 700" preserveAspectRatio="none">
  <path class="arc ghost" d="M905 200 C 1020 400, 830 640, 500 650 C 250 655, 90 590, 72 470"/>
  <path class="arc" d="M905 200 C 1020 400, 830 640, 500 650 C 250 655, 90 590, 72 470"/>
  <path class="arc flow" d="M905 200 C 1020 400, 830 640, 500 650 C 250 655, 90 590, 72 470"/>
  <path class="head" d="M40 482 L72 418 L108 486 Z"/>
 </svg></div>
</div></main>
<script src="entry.js"></script>
</body>
</html>

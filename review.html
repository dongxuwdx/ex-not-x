<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><script>try{var l=JSON.parse(localStorage.getItem('exnotx-lang')||'"both"');l=(l==='zh'||l==='en')?l:'both';document.documentElement.dataset.lang=l;if(l==='en')document.documentElement.lang='en'}catch(e){document.documentElement.dataset.lang='both'}</script><meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{if(localStorage.getItem('exnotx-auth')!=='1')location.replace('login.html?next='+encodeURIComponent('review.html'+location.search))}catch{}</script>
<title>Ex not X · 留学生情感社区｜AI 总结</title>
<meta name="description" content="AI 感情总结：基于你的回答与你写下的话。">
<link rel="stylesheet" href="site.css">
<style>
.top{text-align:center;padding:40px 0 30px}
.duo{position:relative;display:flex;justify-content:center;margin:22px auto 0;width:310px;height:200px}
.duo .c{position:absolute;top:0;width:172px;height:172px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.duo .you{left:0;background:var(--stripes);z-index:1}
.duo .them{right:0;background:var(--blue)}
.duo small{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase}
.duo strong{font-size:16px;font-weight:800;margin:8px 0 6px;letter-spacing:.04em}
.duo .c>span{font-size:8px;letter-spacing:.16em;text-transform:uppercase}
.duo .script{position:absolute;left:50%;bottom:-6px;translate:-50% 0;z-index:2;font-size:76px;color:var(--ink);mix-blend-mode:normal;white-space:nowrap}
.headline{font-size:20px;font-weight:800;color:var(--ink);margin:26px 0 8px;line-height:1.4}
.head-en{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.basis{font-size:10.5px;color:var(--text);margin-top:12px}
.demo-note{display:inline-flex;gap:10px;align-items:center;margin-top:16px;font-size:12px;border:1px solid var(--blue);padding:8px 12px;color:var(--blue);flex-wrap:wrap;justify-content:center}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 195px;gap:38px;align-items:start;padding-bottom:60px}
.bar-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--ink);padding-bottom:6px;margin-bottom:20px;gap:12px;flex-wrap:wrap}
.bar-head h2{margin:0;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);font-weight:800}
.tabs{display:flex;gap:14px}
.tabs button{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:4px 0 6px;border-bottom:1.5px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.story h3{margin:0 0 6px;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);font-weight:700}
.story p{margin:0 0 4px;font-size:12px;line-height:1.85;color:var(--ink)}
.story p.en-p{color:var(--text);font-size:11.5px}
.story section{margin-bottom:22px}
[data-mode="zh"] .en-p,[data-mode="en"] .zh-p{display:none!important}
.story[data-mode="both"] .en-p{margin-top:4px;padding-left:10px;border-left:2px solid var(--line)}
.reflect{position:relative;background:var(--dark);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 10px,transparent 10px 20px);color:#fff;padding:34px 26px 26px;margin:36px 0 34px}
.reflect .script{position:absolute;right:12px;top:-30px;font-size:62px;color:#6a7cf0;mix-blend-mode:normal;transform:rotate(-4deg)}
.reflect .k{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#d0d0d0}
.reflect .body{font-size:12.5px;line-height:1.95;margin:14px 0 20px}
.reflect .body .zh-p,.reflect .body .en-p{display:block;}
.reflect .body .zh-p+.en-p{font-size:11.5px;color:#cfcfcf;margin-top:8px}
.reflect hr{border:0;border-top:1px solid #3d3d3d;margin:0 0 16px}
.reflect .qk{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#8d9cf5;font-weight:700}
.reflect ol{margin:10px 0 0;padding-left:16px;font-size:10.5px;line-height:2;color:#e8e8e8}
.reflect ol .en-p{color:#bdbdbd}
.own h2,.lp-head h2{margin:0;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);font-weight:800}
.own{margin-bottom:36px}
.own .bar-head{margin-bottom:8px}
.own p{font-size:10px;color:var(--text);margin:0 0 12px}
.own textarea{width:100%;min-height:96px;border:1px solid var(--ink);padding:10px 12px;font-size:12.5px;line-height:1.7;resize:vertical;outline:none}
.own textarea:focus{border-color:var(--blue)}
.own .saved{font-size:10px;color:var(--muted);margin-top:6px;min-height:1em}
.lp-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.lp-head span{font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
.lp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}
.lp>div{padding:16px 16px 18px}
.lp>div+div{border-left:1px solid var(--line)}
.lp .chip{height:16px;font-size:8px}
.lp h3{margin:12px 0 2px;font-size:15px;font-weight:800;color:var(--ink)}
.lp .en-n{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.lp dl{display:grid;grid-template-columns:72px 1fr;gap:10px 8px;margin:16px 0 0;font-size:10.5px;line-height:1.55}
.lp dt{font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.lp dd{margin:0;color:var(--ink)}
.chem{margin-top:34px}
.chem .legend{display:flex;gap:14px;font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0 4px;align-items:center}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.dot.y{background:var(--blue)}.dot.t{background:var(--ink)}
.dim{padding:16px 0 12px;border-bottom:1px solid var(--line)}
.dim .labels{display:grid;grid-template-columns:1fr auto 1fr;font-size:8.5px;color:var(--text);gap:8px}
.dim .labels b{font-size:9.5px;color:var(--ink)}
.dim .labels span:last-child{text-align:right}
.track{position:relative;height:1px;background:#cfcfcf;margin:14px 0 14px}
.track i{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;translate:-50% -50%;transition:left 1s cubic-bezier(.2,.8,.2,1)}
.track .y{background:var(--blue)}.track .t{background:var(--ink)}
.dim p{margin:0;font-size:10.5px;color:var(--ink)}
.dim p .en{color:var(--text)}
.disclaimer{font-size:10px;line-height:1.75;color:var(--text);margin-top:40px}
.disclaimer a{color:var(--blue);text-decoration:underline}
.side{position:sticky;top:20px}
.keep{border:1.5px solid var(--ink);padding:16px 14px}
.keep h2{margin:6px 0 12px;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);font-weight:800}
.keep .o{display:block;width:100%;text-align:left;padding:9px 10px;border:1px solid #cfcfcf;margin-bottom:6px;background:#fff}
.keep .o b{display:block;font-size:10.5px;color:var(--ink)}
.keep .o>span{font-size:7.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text)}
.keep .o[aria-checked="true"]{background:var(--blue);border-color:var(--blue)}
.keep .o[aria-checked="true"] b,.keep .o[aria-checked="true"]>span{color:#fff}
.keep .btn{width:100%;min-height:34px;font-size:8.5px;padding:0 6px;margin-top:6px}
.more-acts{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink);margin-top:-1px}
.more-acts li{border-bottom:1px solid var(--line)}
.more-acts button,.more-acts a{display:block;width:100%;text-align:left;padding:13px 0;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.more-acts button:hover,.more-acts a:hover{color:var(--blue)}
@media (max-width:800px){.cols{grid-template-columns:1fr}.side{position:static;order:-1}.lp{grid-template-columns:1fr}.lp>div+div{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>

<header id="site-header"></header>
<main class="scale-up"><div class="wrap" style="width:min(820px,100% - 48px)" id="main"></div></main>
<footer id="site-footer"></footer>
<script src="site.js"></script>
<script src="reflect.js"></script>
<script src="review.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{if(localStorage.getItem('exnotx-auth')!=='1')location.replace('login.html?next=journal.html')}catch{}</script>
<title>Ex not X · 留学生情感社区｜我的日记</title>
<link rel="stylesheet" href="site.css">
<style>
.page-hero .script{font-size:110px;left:50%;top:-24px;transform:rotate(-5deg)}
.entries{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.mini{position:relative;width:96px;height:62px}
.mini i{position:absolute;top:0;width:62px;height:62px;border-radius:50%}
.mini i:first-child{left:0;background:var(--stripes);z-index:1}.mini i:last-child{right:0;background:var(--blue)}
.entry h2{margin:4px 0 4px;font-size:17px;color:var(--ink)}
.entry .meta{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.entry .own{font-size:13.5px;color:var(--text);margin:6px 0 0;max-width:52ch}
.entry .acts{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.del{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.del:hover{color:#b4232c}
.none{text-align:center;padding:50px 0;color:var(--muted)}
.none .btn{margin-top:20px}
@media (max-width:600px){.entry{grid-template-columns:1fr}.entry .acts{flex-direction:row;align-items:center}}
</style>
</head>
<body data-page="journal">
<header id="site-header"></header>
<main class="narrow" style="padding-bottom:70px">
 <section class="page-hero">
  <div class="hero-stack">
   <p class="kicker">我的日记 · Journal</p>
   <h1 class="title-zh">只有你看得到的地方</h1>
   <p class="title-en">A place only you can see</p>
   <span class="script" aria-hidden="true">Dear me</span>
  </div>
 </section>
 <ul class="entries" id="entries"></ul>
</main>
<footer id="site-footer"></footer>
<script src="site.js"></script>
<script>
(function(){
 const {store,esc,toast}=EX;let list=store.get('journal',[]);const notes=store.get('own-reflections',{});
 const KEEP={private:'仅自己可见 Private',anon:'已匿名发布 Shared anonymously',named:'已以昵称发布 Shared with name'};
 const draw=()=>{const el=document.getElementById('entries');
  el.innerHTML=list.length?list.map(j=>`<li class="entry"><span class="mini" aria-hidden="true"><i></i><i></i></span>
   <div><span class="meta">${esc(j.date)} · ${KEEP[j.keep]||KEEP.private}</span><h2>You &amp; ${esc(j.summary.name)} · ${esc(j.summary.you.zh)} × ${esc(j.summary.them.zh)}</h2>
   <span class="meta">${esc(j.summary.headline[0])}</span>${(notes[j.id]||j.own)?`<p class="own">“${esc(notes[j.id]||j.own)}”</p>`:''}</div>
   <div class="acts"><a class="btn" href="review.html?id=${encodeURIComponent(j.id)}">打开 Open</a><button class="del" type="button" data-del="${esc(j.id)}">删除 Delete</button></div></li>`).join('')
  :`<li class="none">日记还是空的。做一次感情测评，把总结存进来吧。<br><span class="en">Your journal is empty. Take the quiz and save your summary here.</span><br><a class="btn solid" href="quiz.html">开始测评 Start the quiz</a></li>`};
 document.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(!b)return;if(!confirm('删除这篇日记？ Delete this entry?'))return;list=list.filter(j=>j.id!==b.dataset.del);store.set('journal',list);draw();toast('已删除 · Deleted')});
 draw();
})();
</script>
</body>
</html>
